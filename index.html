<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product CRUD</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Product CRUD</h1>
    <p>Cadastre, consulte, edite e remova produtos.</p>
  </header>

  <main class="layout">
    <section class="coluna">
      <form id="add-product-form" class="card">
        <h2>Adicionar produto</h2>
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" required>

        <label for="price">Preço</label>
        <input type="number" id="price" name="price" required step="0.01" min="0">

        <label for="description">Descrição</label>
        <textarea id="description" name="description" rows="3"></textarea>

        <button type="submit">Adicionar</button>
      </form>

      <form id="update-product-form" class="card" hidden>
        <h2>Editar produto <span id="update-label"></span></h2>
        <input type="hidden" id="update-id" name="id">

        <label for="update-name">Nome</label>
        <input type="text" id="update-name" name="name" required>

        <label for="update-price">Preço</label>
        <input type="number" id="update-price" name="price" required step="0.01" min="0">

        <label for="update-description">Descrição</label>
        <textarea id="update-description" name="description" rows="3"></textarea>

        <div class="acoes">
          <button type="submit">Salvar alterações</button>
          <button type="button" id="cancel-update" class="secundario">Cancelar</button>
        </div>
      </form>

      <form id="search-form" class="card">
        <h2>Consultar por ID</h2>
        <label for="search-id">ID do produto</label>
        <input type="number" id="search-id" min="1" required>
        <div class="acoes">
          <button type="submit">Buscar</button>
          <button type="button" id="clear-search" class="secundario">Limpar</button>
        </div>
        <div id="search-result" class="resultado" aria-live="polite"></div>
      </form>
    </section>

    <section class="coluna">
      <h2 class="titulo-lista">Produtos</h2>
      <ul id="products"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
